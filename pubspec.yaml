name: daketi_phase1_modular
description: Daketi Phase I modular Flutter UI.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0
  flutter_riverpod: ^2.3.0
  http: ^1.6.0
  socket_io_client: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Dirty Brush
      fonts:
        - asset: assets/fonts/DirtyBrush-Regular.ttf
          weight: 400
