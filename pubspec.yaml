name: daketi_phase1_modular
description: Daketi Phase I modular Flutter UI.
publish_to: "none"
version: 2.6.0+16

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0
  flutter_riverpod: ^2.3.0
  http: ^1.6.0
  socket_io_client: ^2.0.0
  audioplayers: 6.4.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  video_player: ^2.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/videos/
    - assets/audio/game/
    - assets/images/
    - assets/images/players/
    - assets/images/cards/style01/Clubs/
    - assets/images/cards/style01/Diamonds/
    - assets/images/cards/style01/Hearts/
    - assets/images/cards/style01/Spades/
    - assets/icons/

  fonts:
    - family: Dirty Brush
      fonts:
        - asset: assets/fonts/DirtyBrush-Regular.ttf
          weight: 400
